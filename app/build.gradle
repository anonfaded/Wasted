plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "me.lucky.wasted"
    compileSdk = 36

    defaultConfig {
        applicationId = "me.lucky.wasted"
        minSdk = 24
        targetSdk = 36
        versionCode = 42
        versionName = "3.0.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
        aidl = true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        disable 'MissingTranslation'
    }
}

android.applicationVariants.all { variant ->
    def suffix = variant.buildType.name == 'release' ? '' : "-${variant.buildType.name}"
    variant.outputs.all {
        outputFileName = "Wasted-v${variant.versionName}${suffix}.apk"
    }
}

// ── Generated remote assets ─────────────────────────────────────────────────
// The dashboard template and setup SQL are build products of the tracked sources, so an APK
// can never be assembled with stale assets. Node.js (>= 20) is required for the web bundle.

def nodeBinary = System.getenv('NODE_BIN') ?: 'node'
def npmBinary = System.getenv('NPM_BIN') ?: 'npm'
def webProjectDir = rootProject.file('web')
def dashboardTemplateAsset = file('src/main/assets/dashboard-template.html')
def setupSqlAsset = file('src/main/assets/setup.sql')
def setupSqlSource = rootProject.file('supabase/setup.sql')
def supabaseMigrationsDir = rootProject.file('supabase/migrations')

tasks.register('checkNode') {
    doLast {
        try {
            def process = new ProcessBuilder(nodeBinary, '--version')
                .directory(webProjectDir)
                .redirectErrorStream(true)
                .start()
            def output = process.inputStream.text.trim()
            if (process.waitFor() != 0) {
                throw new GradleException("Node.js failed to start (${nodeBinary} ${output}).")
            }
            logger.info("Using Node.js ${output}")
        } catch (IOException ignored) {
            throw new GradleException(
                "Node.js is required to generate the remote assets. " +
                    "Install Node.js 20+ or set NODE_BIN/NPM_BIN."
            )
        }
    }
}

tasks.register('ensureWebDependencies', Exec) {
    dependsOn 'checkNode'
    workingDir webProjectDir
    commandLine npmBinary, 'ci', '--silent'
    inputs.file(new File(webProjectDir, 'package-lock.json'))
    outputs.dir(new File(webProjectDir, 'node_modules'))
    onlyIf { !new File(webProjectDir, 'node_modules').exists() }
}

tasks.register('generateDashboardTemplate', Exec) {
    group = 'build'
    description = 'Bundles the single-file dashboard template used by the setup wizard.'
    dependsOn 'ensureWebDependencies'
    workingDir webProjectDir
    commandLine nodeBinary, 'build-android-template.mjs'
    inputs.files(
        new File(webProjectDir, 'index.html'),
        new File(webProjectDir, 'build-lib.mjs'),
        new File(webProjectDir, 'build-android-template.mjs'),
        new File(webProjectDir, 'package.json'),
        new File(webProjectDir, 'package-lock.json'),
    )
    inputs.dir(new File(webProjectDir, 'src'))
    inputs.dir(new File(webProjectDir, 'styles'))
    outputs.file(dashboardTemplateAsset)
}

tasks.register('generateSetupSql', Exec) {
    group = 'build'
    description = 'Builds setup.sql from the ordered migrations and copies it into assets.'
    dependsOn 'checkNode'
    workingDir rootProject.projectDir
    commandLine nodeBinary, 'supabase/build-setup-sql.mjs'
    inputs.dir(supabaseMigrationsDir)
    inputs.file(rootProject.file('supabase/build-setup-sql.mjs'))
    inputs.file(rootProject.file('supabase/releases.json'))
    outputs.files(setupSqlSource, setupSqlAsset)
    outputs.dir(rootProject.file('supabase/releases'))
    outputs.dir(new File(projectDir, 'src/main/assets/updates'))
}

tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn 'generateDashboardTemplate', 'generateSetupSql'
}

tasks.register('verifyRemoteSchema', Exec) {
    group = 'verification'
    description = 'Diffs local migrations against the linked Supabase project. Requires Supabase CLI, Docker, and supabase link.'
    workingDir rootProject.projectDir
    commandLine 'supabase', 'db', 'diff', '--linked'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Security & Encryption
    implementation 'com.google.crypto.tink:tink-android:1.21.0'
    
    // Network (open source, Apache 2.0)
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-tls:5.3.2'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    
    // Local Storage
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    
    // https://issuetracker.google.com/issues/238425626
    implementation('androidx.preference:preference-ktx:1.2.1') {
        exclude group: 'androidx.lifecycle', module:'lifecycle-viewmodel'
        exclude group: 'androidx.lifecycle', module:'lifecycle-viewmodel-ktx'
    }
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'info.guardianproject.panic:panic:1.0'

    // Shizuku — ADB-level shell without root (API 23+)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Remote management — Supabase (Auth / PostgREST / Realtime) on the OkHttp stack
    implementation platform('io.github.jan-tennert.supabase:bom:3.8.0')
    implementation 'io.github.jan-tennert.supabase:auth-kt'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'io.github.jan-tennert.supabase:realtime-kt'
    implementation 'io.ktor:ktor-client-okhttp:3.5.1'
    implementation 'io.ktor:ktor-client-websockets:3.5.1'

    // Remote recovery scheduling (API 24+)
    implementation 'androidx.work:work-runtime:2.12.0'

    // Encrypted remote journal/outbox database
    implementation 'net.zetetic:sqlcipher-android:4.19.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
